<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navidad en el Lab</title>
<meta name="description" content="Fondo animado navideño del laboratorio: integrantes en plastilina, bacterias acidófilas y peluches que cantan.">
<style>
  html, body { margin: 0; height: 100%; background: #101214; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; cursor: none; }
  canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  #load { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #13281c; color: #fff8e0; font: 600 3vh 'Trebuchet MS', sans-serif; transition: opacity 1s; z-index: 5; }
  #load .b { width: 30vw; height: 1vh; background: rgba(255,255,255,0.15); border-radius: 1vh; margin-top: 2vh; overflow: hidden; }
  #bar { width: 0; height: 100%; background: #f2c94c; transition: width .3s; }
  #snd { position: fixed; right: 1.6vh; bottom: 1.6vh; width: 5vh; height: 5vh; border-radius: 50%; border: 0; padding: 0;
    background: rgba(20,20,20,0.28); z-index: 4; opacity: 0.55; cursor: pointer; }
  #snd svg { width: 60%; height: 60%; margin-top: 3px; }
  #snd.off .w { display: none; } #snd.on .x { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="load">Preparando el lab…<div class="b"><div id="bar"></div></div></div>
<button id="snd" aria-label="Sonido">
  <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff"/>
    <path class="w" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>
    <path class="x" d="M16 9l5 6M21 9l-5 6"/>
  </svg>
</button>
<script src="js/core.js?v=5"></script>
<script src="js/clay.js?v=5"></script>
<script src="js/labart.js?v=5"></script>
<script src="js/scene.js?v=5"></script>
<script src="js/people.js?v=5"></script>
<script src="js/critters.js?v=5"></script>
<script src="js/plush.js?v=5"></script>
<script src="js/fx.js?v=5"></script>
<script src="js/music.js?v=5"></script>
<script src="js/director.js?v=5"></script>
<script src="js/main.js?v=5"></script>
</body>
</html>
